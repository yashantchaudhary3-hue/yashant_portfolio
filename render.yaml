services:
  - type: web
    name: yashant-chaudhary-portfolio
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_NAME
        value: Yashant Chaudhary | Developer Portfolio
    disk:
      name: portfolio-messages
      mountPath: /opt/render/project/src/data
      sizeGB: 1
